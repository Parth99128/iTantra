name: iTantra Offline ML Build

on:
  workflow_dispatch:
  push:
    branches: [sih-26173-offline-ml]

jobs:
  build-offline-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Python model tooling
        run: python3 -m pip install --disable-pip-version-check onnx==1.17.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build compact base APK without neural weights
        run: |
          rm -rf app/src/main/assets/models build/model-packs
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK contains no neural weights
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;
          if unzip -l app/build/outputs/apk/debug/app-arm64-v8a-debug.apk | grep -E 'assets/models|model.onnx|final.mdl|Gr.fst|silero_vad'; then
            echo 'ERROR: model weights leaked into base APK'
            exit 1
          fi

      - name: Build individual offline language packs
        run: |
          mkdir -p build/model-packs
          for spec in 'hi:hi:hi' 'en:en:en' 'mr:none:mr'; do
            IFS=: read -r name stt tts <<< "$spec"
            rm -rf app/src/main/assets/models
            python3 tools/fetch_models.py --stt "$stt" --tts "$tts"
            mkdir -p "build/model-packs/$name"
            cp -a app/src/main/assets/models "build/model-packs/$name/models"
            echo "=== $name pack footprint ==="
            du -sh "build/model-packs/$name/models"
            cd "build/model-packs/$name"
            zip -qr "../itantra-offline-$name-pack.zip" models
            cd ../../..
          done
          rm -rf app/src/main/assets/models
          ls -lh build/model-packs/*.zip

      - name: Upload APK and separate offline language packs
        uses: actions/upload-artifact@v4
        with:
          name: itantra-offline-ml-release
          path: |
            app/build/outputs/apk/debug/*.apk
            build/model-packs/*.zip
          retention-days: 14
