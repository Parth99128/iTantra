name: iTantra Offline ML Build

on:
  workflow_dispatch:
  push:
    branches: [sih-26173-offline-ml]

jobs:
  build-offline-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python model tooling
        run: python3 -m pip install --disable-pip-version-check onnx==1.17.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Provision real offline model packs
        run: |
          python3 tools/fetch_models.py --stt hi,en,gu --tts hi,mr,en
          find app/src/main/assets/models -maxdepth 4 -type f -printf '%p %k KB\n' | sort

      - name: Build debug APK with bundled models
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK contains model assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'silero_vad|model.onnx|tokens.txt' | head -80

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itantra-offline-ml-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
