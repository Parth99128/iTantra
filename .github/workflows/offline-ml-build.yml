name: iTantra Offline ML Build

on:
  workflow_dispatch:
  push:
    branches: [sih-26173-offline-ml]

jobs:
  build-offline-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Python model tooling
        run: python3 -m pip install --disable-pip-version-check onnx==1.17.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Provision real offline model pack outside APK
        run: |
          rm -rf app/src/main/assets/models build/model-pack
          python3 tools/fetch_models.py --stt hi,en --tts hi,mr,en
          mkdir -p build/model-pack
          cp -a app/src/main/assets/models build/model-pack/models
          echo "=== offline model pack footprint ==="
          du -sh build/model-pack/models
          find build/model-pack/models -type f -printf '%p %k KB\n' | sort
          rm -rf app/src/main/assets/models

      - name: Build compact ABI-specific APKs
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify compact APKs
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;
          echo "=== APK must not contain neural model weights ==="
          if unzip -l app/build/outputs/apk/debug/app-arm64-v8a-debug.apk | grep -E 'assets/models|model.onnx|final.mdl|Gr.fst|silero_vad'; then
            echo 'ERROR: model weights leaked into APK'
            exit 1
          fi

      - name: Zip offline model pack
        run: |
          cd build/model-pack
          zip -qr ../itantra-offline-model-pack-hi-en-mr.zip models
          cd ../..
          ls -lh build/itantra-offline-model-pack-hi-en-mr.zip

      - name: Upload compact APKs and offline model pack
        uses: actions/upload-artifact@v4
        with:
          name: itantra-offline-ml-release
          path: |
            app/build/outputs/apk/debug/*.apk
            build/itantra-offline-model-pack-hi-en-mr.zip
          retention-days: 14
