name: iTantra Offline ML Build

on:
  workflow_dispatch:
  push:
    branches: [sih-26173-offline-ml]

jobs:
  build-offline-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Python model tooling
        run: python3 -m pip install --disable-pip-version-check onnx==1.17.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Provision compact real offline model packs
        run: |
          python3 tools/fetch_models.py --stt hi,en,gu --tts hi,mr,en
          echo "=== model footprint ==="
          du -sh app/src/main/assets/models
          find app/src/main/assets/models -type f -printf '%p %k KB\n' | sort

      - name: Build ABI-specific debug APKs
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APKs and report sizes
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;
          for APK in app/build/outputs/apk/debug/*.apk; do
            echo "=== $APK ==="
            unzip -l "$APK" | grep -E 'silero_vad|model.onnx|tokens.txt|espeak-ng-data' | head -100
          done

      - name: Upload ABI-specific APKs
        uses: actions/upload-artifact@v4
        with:
          name: itantra-offline-ml-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
