name: iTantra Offline ML Build

on:
  workflow_dispatch:
  push:
    branches:
      - sih-26173-offline-ml

jobs:
  build-offline-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Python model tooling
        run: python3 -m pip install --disable-pip-version-check onnx==1.17.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build compact base APK without neural weights
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/models build/model-packs
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK contains no neural weights
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;
          if unzip -l app/build/outputs/apk/debug/app-arm64-v8a-debug.apk | grep -Eq 'assets/models|model\.onnx|final\.mdl|Gr\.fst|silero_vad'; then
            echo 'ERROR: model weights leaked into base APK'
            exit 1
          fi

      - name: Build Hindi offline language pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/models build/current-pack
          python3 tools/fetch_models.py --stt hi --tts hi
          mkdir -p build/current-pack/models
          cp -a app/src/main/assets/models/. build/current-pack/models/
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('build/current-pack/pack.json').write_text(json.dumps({
              'format_version': 1,
              'language': 'hi',
              'offline': True,
              'stt': True,
              'tts': True,
              'vad': True,
              'runtime': 'Vosk + sherpa-onnx + ONNX Runtime'
          }, indent=2) + '\n', encoding='utf-8')
          PY
          mkdir -p build/model-packs
          cd build/current-pack
          zip -qr ../model-packs/itantra-offline-hi-pack.zip pack.json models
          cd ../..
          rm -rf build/current-pack app/src/main/assets/models

      - name: Build English offline language pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/models build/current-pack
          python3 tools/fetch_models.py --stt en --tts en
          mkdir -p build/current-pack/models
          cp -a app/src/main/assets/models/. build/current-pack/models/
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('build/current-pack/pack.json').write_text(json.dumps({
              'format_version': 1,
              'language': 'en',
              'offline': True,
              'stt': True,
              'tts': True,
              'vad': True,
              'runtime': 'Vosk + sherpa-onnx + ONNX Runtime'
          }, indent=2) + '\n', encoding='utf-8')
          PY
          mkdir -p build/model-packs
          cd build/current-pack
          zip -qr ../model-packs/itantra-offline-en-pack.zip pack.json models
          cd ../..
          rm -rf build/current-pack app/src/main/assets/models

      - name: Build Marathi offline language pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/models build/current-pack
          python3 tools/fetch_models.py --stt none --tts mr
          mkdir -p build/current-pack/models
          cp -a app/src/main/assets/models/. build/current-pack/models/
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('build/current-pack/pack.json').write_text(json.dumps({
              'format_version': 1,
              'language': 'mr',
              'offline': True,
              'stt': False,
              'tts': True,
              'vad': True,
              'runtime': 'sherpa-onnx + ONNX Runtime'
          }, indent=2) + '\n', encoding='utf-8')
          PY
          mkdir -p build/model-packs
          cd build/current-pack
          zip -qr ../model-packs/itantra-offline-mr-pack.zip pack.json models
          cd ../..
          rm -rf build/current-pack app/src/main/assets/models

      - name: Validate language packs
        shell: bash
        run: |
          set -euo pipefail
          for name in hi en mr; do
            archive="build/model-packs/itantra-offline-${name}-pack.zip"
            test -f "$archive"
            unzip -t "$archive" >/dev/null
            unzip -p "$archive" pack.json | grep -q "\"language\": \"${name}\""
            unzip -l "$archive" | grep -q 'models/vad/silero_vad.onnx'
          done
          ls -lh build/model-packs/*.zip

      - name: Upload APK and separate offline language packs
        uses: actions/upload-artifact@v4
        with:
          name: itantra-offline-ml-release
          path: |
            app/build/outputs/apk/debug/*.apk
            build/model-packs/*.zip
          retention-days: 14
